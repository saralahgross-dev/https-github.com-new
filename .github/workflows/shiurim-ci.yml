name: Shiurim CI

on:
  push:
    branches: [shiurim-ios-appstore]
  workflow_dispatch:

jobs:
  audio-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all Google Drive audio streams
        run: python3 shiurim-app/ci/audio_check.py

  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: shiurim-app/ios
        run: xcodegen generate
      - name: Compile iOS app for Simulator
        working-directory: shiurim-app/ios
        run: |
          xcodebuild -project Shiurim.xcodeproj -scheme Shiurim -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
