<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="שיעורים">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>שיעורי קהל ברכת יצחק</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#13202b;background:#f6f7f8;--accent:#17324d;--border:#e1e5e8;--muted:#68737e;--card:#fff}
*{box-sizing:border-box}body{margin:0;padding-bottom:205px;background:linear-gradient(#f9fafb,#f3f5f6);min-height:100vh}button,input,select{font:inherit}.hidden{display:none!important}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));background:#fffffff2;backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;border-radius:12px}.brand h1{font-size:20px;margin:0 0 2px}.brand p{font-size:13px;color:var(--muted);margin:0}
main{max-width:980px;margin:auto;padding:16px}.toolbar{display:grid;grid-template-columns:minmax(180px,2fr) 1fr 1.3fr auto;gap:8px;margin-bottom:14px}.toolbar input,.toolbar select,.secondary{width:100%;min-height:44px;border:1px solid var(--border);border-radius:12px;padding:0 12px;background:#fff;color:#111}.secondary{width:auto;color:var(--accent);cursor:pointer}
.resume{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#eaf0f5;border:1px solid #d7e0e8;border-radius:16px;padding:14px 16px;margin-bottom:14px}.resume button{border:0;border-radius:10px;background:var(--accent);color:white;padding:9px 14px}
.results{display:flex;flex-direction:column;gap:18px}.section{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px #00000009}.section h2{font-size:18px;margin:0;padding:14px 16px;background:#fafbfc;border-bottom:1px solid var(--border)}
.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #eef0f2}.row:last-child{border-bottom:0}.row-main{border:0;background:transparent;text-align:right;padding:7px 6px;color:inherit;cursor:pointer}.row-title{font-size:16px;line-height:1.35}.row-meta{font-size:12px;color:var(--muted);margin-top:3px}.new{font-size:11px;font-weight:700;background:#c83532;color:white;padding:4px 7px;border-radius:999px}.star{border:0;background:transparent;color:var(--accent);font-size:23px;min-width:40px;min-height:40px;border-radius:50%;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:40px 18px;background:white;border:1px solid var(--border);border-radius:16px}
.player{position:fixed;z-index:20;left:0;right:0;bottom:0;background:#fffffff8;backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-shadow:0 -5px 22px #00000014}.player-inner{max-width:900px;margin:auto}.player-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.now{min-width:0;display:flex;flex-direction:column}.now strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted);font-size:12px}.share{border:0;background:transparent;color:var(--accent);font-size:20px}.player input{width:100%;margin-top:8px}.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.controls{display:flex;justify-content:center;align-items:center;gap:12px}.round{border:0;background:transparent;color:var(--accent);font-weight:700;min-width:42px;min-height:42px;border-radius:50%}.play{width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:22px}.install-tip{max-width:980px;margin:0 auto 12px;padding:0 16px}.tip{background:#fff8df;border:1px solid #ead9a0;border-radius:14px;padding:12px 14px;font-size:14px}
footer{max-width:980px;margin:26px auto;padding:0 16px 20px;text-align:center;color:var(--muted);font-size:13px}footer a{color:var(--accent)}
@media(max-width:720px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.toolbar #section{grid-column:1/-1}.brand h1{font-size:17px}.brand img{width:42px;height:42px}.controls{gap:7px}}
</style>
</head>
<body>
<header><div class="brand"><img src="./icon.svg" alt=""><div><h1>שיעורי קהל ברכת יצחק</h1><p id="meta">טוען מאגר שיעורים…</p></div></div><button id="installBtn" class="secondary hidden">התקן</button></header>
<div id="iosTip" class="install-tip hidden"><div class="tip">באייפון: לחצו על כפתור השיתוף בספארי ואז <b>הוסף למסך הבית</b>.</div></div>
<main>
<section class="toolbar"><input id="search" class="search" type="search" placeholder="חיפוש שיעור או נושא" autocomplete="off"><select id="year"><option value="">כל השנים</option></select><select id="section"><option value="">כל הסדרות</option></select><button id="favOnly" class="secondary" aria-pressed="false">☆ מועדפים</button></section>
<section id="resume" class="resume hidden"><div><strong>המשך האזנה</strong><div id="resumeText" class="muted"></div></div><button id="resumeBtn">המשך</button></section>
<section id="results" class="results"></section>
</main>
<footer><a href="./privacy.html">מדיניות פרטיות</a> · אפליקציית שיעורים</footer>
<section id="player" class="player hidden"><div class="player-inner"><div class="player-top"><div class="now"><strong id="nowTitle"></strong><span id="nowMeta" class="muted"></span></div><button id="share" class="share" title="שתף">↗</button></div><audio id="audio" preload="metadata"></audio><input id="seek" type="range" min="0" max="1" value="0" step="1"><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="controls"><button id="back" class="round">−15</button><button id="play" class="play">▶</button><button id="forward" class="round">+15</button><button id="speed" class="secondary">1×</button><button id="favCurrent" class="star">☆</button></div></div></section>
<script>
var q=function(s){return document.querySelector(s)};
var el={results:q('#results'),search:q('#search'),year:q('#year'),section:q('#section'),favOnly:q('#favOnly'),meta:q('#meta'),resume:q('#resume'),resumeText:q('#resumeText'),resumeBtn:q('#resumeBtn'),player:q('#player'),audio:q('#audio'),nowTitle:q('#nowTitle'),nowMeta:q('#nowMeta'),play:q('#play'),back:q('#back'),forward:q('#forward'),speed:q('#speed'),seek:q('#seek'),elapsed:q('#elapsed'),duration:q('#duration'),favCurrent:q('#favCurrent'),share:q('#share'),installBtn:q('#installBtn'),iosTip:q('#iosTip')};
var recordings=[],current=null,favOnly=false,deferredInstall=null,rates=[1,1.25,1.5,2],rateIndex=0;
var favorites=new Set(JSON.parse(localStorage.getItem('shiurim-favorites')||'[]'));
var resume=JSON.parse(localStorage.getItem('shiurim-resume')||'{}');
function fmt(s){if(!Number.isFinite(s)||s<0)return'0:00';s=Math.floor(s);var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return h?(h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')):(m+':'+String(x).padStart(2,'0'))}
function saveFav(){localStorage.setItem('shiurim-favorites',JSON.stringify(Array.from(favorites)))}
function isNew(r){if(!r.firstSeen)return false;var d=new Date(r.firstSeen+'T00:00:00');var age=Date.now()-d.getTime();return age>=0&&age<30*864e5}
function populate(){var years=Array.from(new Set(recordings.map(function(r){return r.year}).filter(Boolean)));var order=['תש"פ','תשפ"א','תשפ"ב','תשפ"ג','תשפ"ד','תשפ"ה','תשפ"ו'];years.sort(function(a,b){var ai=order.indexOf(a),bi=order.indexOf(b);ai=ai<0?99:ai;bi=bi<0?99:bi;return ai-bi||a.localeCompare(b,'he')});years.forEach(function(y){el.year.add(new Option(y,y))});var secs=Array.from(new Set(recordings.map(function(r){return r.section})));secs.sort(function(a,b){return (recordings.find(function(r){return r.section===a}).sectionOrder)-(recordings.find(function(r){return r.section===b}).sectionOrder)});secs.forEach(function(s){el.section.add(new Option(s,s))})}
function filtered(){var term=el.search.value.trim().toLocaleLowerCase('he');return recordings.filter(function(r){var text=(r.title+' '+r.topic+' '+r.section).toLocaleLowerCase('he');return(!el.year.value||r.year===el.year.value)&&(!el.section.value||r.section===el.section.value)&&(!favOnly||favorites.has(r.id))&&(!term||text.includes(term))})}
function render(){var list=filtered();el.results.innerHTML='';if(!list.length){el.results.innerHTML='<div class="empty">לא נמצאו שיעורים לפי החיפוש שנבחר.</div>';return}var groups=new Map;list.forEach(function(r){if(!groups.has(r.section))groups.set(r.section,[]);groups.get(r.section).push(r)});Array.from(groups.entries()).sort(function(a,b){return a[1][0].sectionOrder-b[1][0].sectionOrder}).forEach(function(entry){var name=entry[0],items=entry[1],s=document.createElement('section');s.className='section';var h=document.createElement('h2');h.textContent=name+' · '+items.length;s.append(h);items.sort(function(a,b){return a.order-b.order}).forEach(function(r){var row=document.createElement('div');row.className='row';var main=document.createElement('button');main.className='row-main';main.innerHTML='<div class="row-title"></div><div class="row-meta"></div>';main.querySelector('.row-title').textContent=r.title;main.querySelector('.row-meta').textContent=[r.topic,r.year].filter(Boolean).join(' · ');main.onclick=function(){playRecording(r)};row.append(main);if(isNew(r)){var n=document.createElement('span');n.className='new';n.textContent='חדש';row.append(n)}var star=document.createElement('button');star.className='star';star.textContent=favorites.has(r.id)?'★':'☆';star.onclick=function(){favorites.has(r.id)?favorites.delete(r.id):favorites.add(r.id);saveFav();render();syncCurrentStar()};row.append(star);s.append(row)});el.results.append(s)})}
function syncCurrentStar(){el.favCurrent.textContent=current&&favorites.has(current.id)?'★':'☆'}
function updateResume(){if(!resume.id)return;var r=recordings.find(function(x){return x.id===resume.id});if(!r)return;el.resume.classList.remove('hidden');el.resumeText.textContent=r.title+' · '+fmt(resume.time||0);el.resumeBtn.onclick=function(){playRecording(r,resume.time||0)}}
function playRecording(r,start){current=r;el.player.classList.remove('hidden');el.nowTitle.textContent=r.title;el.nowMeta.textContent=[r.section,r.year].filter(Boolean).join(' · ');syncCurrentStar();if(el.audio.src!==r.url){el.audio.src=r.url;el.audio.load()}var go=function(){if(Number.isFinite(start)&&start>0)el.audio.currentTime=start;el.audio.playbackRate=rates[rateIndex];el.audio.play().catch(function(){});el.audio.removeEventListener('loadedmetadata',go)};if(el.audio.readyState>=1)go();else el.audio.addEventListener('loadedmetadata',go);if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:r.title,artist:'שיעורי קהל ברכת יצחק',album:r.section});try{navigator.mediaSession.setActionHandler('seekbackward',function(){el.audio.currentTime=Math.max(0,el.audio.currentTime-15)});navigator.mediaSession.setActionHandler('seekforward',function(){el.audio.currentTime=Math.min(el.audio.duration||Infinity,el.audio.currentTime+15)});navigator.mediaSession.setActionHandler('play',function(){el.audio.play()});navigator.mediaSession.setActionHandler('pause',function(){el.audio.pause()})}catch(e){}}}
el.audio.addEventListener('play',function(){el.play.textContent='❚❚'});el.audio.addEventListener('pause',function(){el.play.textContent='▶'});el.audio.addEventListener('loadedmetadata',function(){el.seek.max=Math.max(1,Math.floor(el.audio.duration||1));el.duration.textContent=fmt(el.audio.duration)});el.audio.addEventListener('timeupdate',function(){el.seek.value=Math.floor(el.audio.currentTime||0);el.elapsed.textContent=fmt(el.audio.currentTime);if(current){resume.id=current.id;resume.time=el.audio.currentTime;localStorage.setItem('shiurim-resume',JSON.stringify(resume))}});
el.play.onclick=function(){if(current){el.audio.paused?el.audio.play():el.audio.pause()}};el.back.onclick=function(){el.audio.currentTime=Math.max(0,el.audio.currentTime-15)};el.forward.onclick=function(){el.audio.currentTime=Math.min(el.audio.duration||Infinity,el.audio.currentTime+15)};el.seek.oninput=function(){el.audio.currentTime=Number(el.seek.value)};el.speed.onclick=function(){rateIndex=(rateIndex+1)%rates.length;el.audio.playbackRate=rates[rateIndex];el.speed.textContent=rates[rateIndex]+'×'};el.favCurrent.onclick=function(){if(!current)return;favorites.has(current.id)?favorites.delete(current.id):favorites.add(current.id);saveFav();syncCurrentStar();render()};el.share.onclick=async function(){if(!current)return;var data={title:current.title,text:current.title,url:location.href};if(navigator.share){try{await navigator.share(data)}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(location.href)}};
[el.search,el.year,el.section].forEach(function(x){x.addEventListener(x.tagName==='INPUT'?'input':'change',render)});el.favOnly.onclick=function(){favOnly=!favOnly;el.favOnly.setAttribute('aria-pressed',String(favOnly));el.favOnly.textContent=favOnly?'★ מועדפים':'☆ מועדפים';render()};
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;el.installBtn.classList.remove('hidden')});el.installBtn.onclick=async function(){if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;el.installBtn.classList.add('hidden')};
var isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(isiOS&&!standalone)el.iosTip.classList.remove('hidden');
(async function(){try{var res=await fetch('./shiurim-app/shared/recordings.json',{cache:'no-store'});recordings=await res.json();el.meta.textContent=recordings.length+' שיעורים · '+(new Set(recordings.map(function(r){return r.section}))).size+' סדרות';populate();render();updateResume();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){})}catch(e){el.meta.textContent='שגיאה בטעינת המאגר';el.results.innerHTML='<div class="empty">לא ניתן לטעון את מאגר השיעורים.</div>';console.error(e)}})();
</script></body></html>
